<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Self-Healing Network</title><link rel="stylesheet" href="/static/auth.css"></head>
<body><main class="box">
  <div class="brand"><span>🛡</span><h1>Sign in</h1></div>
  <p class="sub">Self-Healing Network · operations console</p>
  <div id="banner" class="banner" role="status"></div>
  <p class="note"><span class="req" style="margin:0">*</span> Fields marked with an asterisk are required.</p>
  <form id="f" novalidate autocomplete="on">
    <label for="id">Username or email<span class="req" aria-hidden="true">*</span></label>
    <input id="id" name="username" required aria-required="true" autocomplete="username" placeholder="e.g. operator or you@company.com">
    <div class="err" id="e_id"></div>

    <label for="pw">Password<span class="req" aria-hidden="true">*</span></label>
    <div class="pw"><input id="pw" name="password" type="password" required aria-required="true" autocomplete="current-password" placeholder="Your password">
      <button type="button" id="tg" aria-label="Show or hide password">Show</button></div>
    <div class="err" id="e_pw"></div>

    <button class="btn" id="go" type="submit">Sign in</button>
  </form>
  <p class="alt">New here? <a href="/signup">Create an account</a></p>
  <p class="demo">Demo accounts: <code>operator</code> / <code>operator123</code> · <code>viewer</code> / <code>viewer123</code></p>
</main>
<script>
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search);
if(q.get("registered")){const b=$("banner");b.className="banner ok";b.textContent="Account created. Please sign in.";$("id").value=q.get("registered")}
if(sessionStorage.getItem("selfheal_token"))location.replace("/");
$("tg").onclick=()=>{const p=$("pw");p.type=p.type==="password"?"text":"password";$("tg").textContent=p.type==="password"?"Show":"Hide"};
function mark(id,eid,msg){$(id).classList.toggle("invalid",!!msg);$(eid).textContent=msg||""}
$("f").addEventListener("submit",async ev=>{ev.preventDefault();
 const idv=$("id").value.trim(),pwv=$("pw").value;
 mark("id","e_id",idv?"":"Username or email is required.");mark("pw","e_pw",pwv?"":"Password is required.");
 if(!idv||!pwv){(idv?$("pw"):$("id")).focus();return}
 $("go").disabled=true;$("go").textContent="Signing in…";
 try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:idv,password:pwv})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(r.status===401?"Wrong username/email or password.":(d.detail||"Sign in failed."));
  sessionStorage.setItem("selfheal_token",d.token);sessionStorage.setItem("selfheal_role",d.role);sessionStorage.setItem("selfheal_name",d.name||d.user);
  location.replace("/");
 }catch(e){const b=$("banner");b.className="banner bad";b.textContent=e.message;$("go").disabled=false;$("go").textContent="Sign in"}});
</script></body></html>
